[tool.poetry]
name = "injectinput"
version = "0.3.1"
description = "Inject input"
authors = ["Dick Marinus <dick@mrns.nl>"]
license = "GPL-3.0"

[tool.poetry.dependencies]
python = ">= 3.8"
evdev = ">= 1.6.1"

[tool.poetry.group.dev.dependencies]
pytest = ">= 8.0.1"
pylint = ">= 3.0.0"
black = ">= 24.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
injectinput = 'injectinput.injectinput:main'
